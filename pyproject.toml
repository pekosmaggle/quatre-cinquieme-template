[project]
name = "quatre-cinquieme-template"
version = "0.1.0"
description = "Template Quatre-Cinquième"
readme = "README.md"
authors = [
    { name = "Martin Cornud", email = "m.cornud@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
]

[project.scripts]
quatre-cinquieme-template = "quatre_cinquieme_template:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # erreurs de style (PEP 8)
    "F",    # erreurs logiques : variables inutilisées, imports manquants
    "I",    # tri des imports
    "B",    # bugs fréquents
    "UP",   # syntaxe Python moderne
    "N",    # conventions de nommage
    "SIM",  # simplifications possibles
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
